name: Refresh SquadStat Data

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Bypass player cache and re-fetch all players"
        type: boolean
        default: false
      stale_hours:
        description: "Cache TTL in hours (default 12; 1 for button-triggered aggressive refresh)"
        type: string
        required: false
      skip_minutes_regression:
        description: "Skip minutes-drop safety check (use after intentional aggregation change)"
        type: boolean
        default: false

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh-minutes-value:
    runs-on: ubuntu-latest
    # Full cache-expiry refetches (~615 players) have exceeded 20 minutes.
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bash scripts/ci-install.sh

      - name: Restore player cache
        uses: actions/cache/restore@v4
        with:
          path: data/player-cache.json
          key: player-cache-${{ github.run_id }}
          restore-keys: player-cache-

      - name: Run refresh scripts
        id: refresh
        env:
          TM_RELAY_URL: ${{ secrets.TM_RELAY_URL }}
          TM_RELAY_SECRET: ${{ secrets.TM_RELAY_SECRET }}
          FORCE_REFRESH: ${{ inputs.force_refresh && '1' || '0' }}
          STALE_HOURS: ${{ inputs.stale_hours }}
          SKIP_MINUTES_REGRESSION: ${{ inputs.skip_minutes_regression && '1' || '0' }}
        run: bun run scripts/refresh-minutes-value.ts

      - name: Save player cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/player-cache.json
          key: player-cache-${{ github.run_id }}

      - name: Commit and push
        # The file list lives in scripts/outputs.ts, next to the script that
        # writes them — never enumerate data files here by hand.
        run: |
          bash scripts/ci-push.sh "chore: refresh minutes-value data" $(bun run scripts/outputs.ts minutes-value)

      - name: Alert on failure
        # 'cancelled' covers the job hitting its timeout, which failure() does not catch.
        if: always() && (steps.refresh.outcome == 'failure' || steps.refresh.outcome == 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "scraper-broken" --color "d73a4a" 2>/dev/null || true
          EXISTING=$(gh issue list --label "scraper-broken" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Alert issue #$EXISTING already open, skipping."
          else
            BODY="The data refresh failed. Check the run log first — the error carries the reason."
            BODY="$BODY"$'\n\n'"**Run:** $RUN_URL"
            BODY="$BODY"$'\n\n'"\`HTTP 403: forbidden\` → TM_RELAY_SECRET drifted from the Worker's."
            BODY="$BODY"$'\n'"\`HTTP 502\` → the relay reached Cloudflare but not Transfermarkt."
            BODY="$BODY"$'\n'"\`Rate limited (0b)\` → Transfermarkt is now blocking Cloudflare too; repoint TM_RELAY_URL at another host."
            BODY="$BODY"$'\n'"Parsed 0 players from a full page → selectors moved; check \`lib/fetch-player-minutes.ts\`."
            BODY="$BODY"$'\n\n'"Worker logs: \`cd workers/tm-relay && bunx wrangler tail\`"
            gh issue create --title "Scraper broken: data refresh failed" --label "scraper-broken" --body "$BODY"
          fi

  check-mv-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bash scripts/ci-install.sh

      - name: Check for market value updates today
        id: check
        env:
          TM_RELAY_URL: ${{ secrets.TM_RELAY_URL }}
          TM_RELAY_SECRET: ${{ secrets.TM_RELAY_SECRET }}
        run: |
          set +e
          bun run scripts/check-mv-updates.ts
          status=$?
          set -e

          case "$status" in
            0) echo "has_updates=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "has_updates=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Market value update check failed with exit code $status." >&2; exit "$status" ;;
          esac

  refresh-biggest-movers:
    needs: [check-mv-updates]
    if: needs.check-mv-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bash scripts/ci-install.sh

      - name: Run refresh script
        env:
          TM_RELAY_URL: ${{ secrets.TM_RELAY_URL }}
          TM_RELAY_SECRET: ${{ secrets.TM_RELAY_SECRET }}
        run: bun run scripts/refresh-biggest-movers.ts

      - name: Commit and push
        run: |
          bash scripts/ci-push.sh "chore: refresh biggest-movers data" $(bun run scripts/outputs.ts biggest-movers)
